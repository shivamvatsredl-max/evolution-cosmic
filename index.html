<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>body { margin: 0; background: #00050a; overflow: hidden; }</style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { create: create, update: update }
        };

        let player, food, enemies, score, levelText, cursors, bg;

        function create() {
            score = parseInt(localStorage.getItem('playerScore')) || 1;

            // 1. CREATE A HUGE WORLD (4000x4000 pixels)
            this.physics.world.setBounds(0, 0, 4000, 4000);

            // 2. BIOLOGICAL BACKGROUND
            bg = this.add.grid(2000, 2000, 4000, 4000, 100, 100, 0x000000, 0, 0x00d9ff, 0.1);

            // 3. GENERATE TEXTURES
            const pG = this.make.graphics().fillStyle(0xffffff).fillCircle(20, 20, 20);
            pG.generateTexture('body', 40, 40);
            const fG = this.make.graphics().fillStyle(0x00ffcc).fillCircle(5, 5, 5);
            fG.generateTexture('food', 10, 10);

            // 4. PLAYER SETUP
            player = this.physics.add.sprite(2000, 2000, 'body');
            player.setCollideWorldBounds(true).setDamping(true).setDrag(0.1);

            // 5. CAMERA SYSTEM (Moves with player)
            this.cameras.main.startFollow(player, true, 0.1, 0.1);
            this.cameras.main.setZoom(1);

            // 6. GROUPS
            food = this.physics.add.group();
            enemies = this.physics.add.group();
            for(let i = 0; i < 200; i++) { spawnFood(); }
            for(let i = 0; i < 15; i++) { spawnEnemy(this); }

            // 7. UI (Fixed to screen)
            levelText = this.add.text(30, 30, '', { fontSize: '28px', fontStyle: 'bold', fill: '#00f2ff' }).setScrollFactor(0);
            updateEvolution();

            // 8. PREDATION
            this.physics.add.overlap(player, food, (p, f) => {
                f.destroy();
                score++;
                spawnFood();
                updateEvolution();
            });

            this.physics.add.overlap(player, enemies, (p, e) => {
                if (score > e.getData('lvl')) {
                    score += 15;
                    e.destroy();
                    spawnEnemy(this);
                    updateEvolution();
                } else {
                    score = Math.max(1, score - 2);
                    this.cameras.main.shake(200, 0.005);
                }
            });

            cursors = this.input.keyboard.createCursorKeys();
        }

        function spawnFood() {
            food.create(Phaser.Math.Between(0, 4000), Phaser.Math.Between(0, 4000), 'food');
        }

        function spawnEnemy(scene) {
            let enemy = enemies.create(Phaser.Math.Between(0, 4000), Phaser.Math.Between(0, 4000), 'body');
            let eLvl = Phaser.Math.Between(score - 5, score + 30);
            enemy.setData('lvl', eLvl).setScale(1 + (eLvl * 0.02)).setTint(0xff4444).setBounce(1).setCollideWorldBounds(true);
            enemy.setVelocity(Phaser.Math.Between(-150, 150), Phaser.Math.Between(-150, 150));
        }

        function updateEvolution() {
            localStorage.setItem('playerScore', score);
            player.setScale(1 + (score * 0.02));
            
            // CAMERA ZOOM OUT as you grow so you can see more
            let targetZoom = Math.max(0.3, 1 - (score * 0.002));
            player.scene.cameras.main.setZoom(targetZoom);

            let species = "Microbe";
            let color = 0x00ff88;
            if(score > 30) { species = "Multi-Cellular"; color = 0x00d9ff; }
            if(score > 80) { species = "Sea Slug"; color = 0xbc00ff; }
            if(score > 200) { species = "Predatory Fish"; color = 0xffa500; }

            levelText.setText(`EVOLUTION: ${species}\nMASS: ${score}`);
            player.setTint(color);
        }

        function update(time) {
            const speed = 1000;
            if (cursors.left.isDown) player.setAccelerationX(-speed);
            else if (cursors.right.isDown) player.setAccelerationX(speed);
            else player.setAccelerationX(0);

            if (cursors.up.isDown) player.setAccelerationY(-speed);
            else if (cursors.down.isDown) player.setAccelerationY(speed);
            else player.setAccelerationY(0);

            // ANIMATED "PULSING" MOVEMENT
            let pulse = 1 + Math.sin(time / 200) * 0.1;
            player.setScale(player.scaleX * 0.99 + (1 + (score * 0.02)) * 0.01 * pulse);

            // Face movement direction
            if (player.body.velocity.x !== 0) {
                player.rotation = Math.atan2(player.body.velocity.y, player.body.velocity.x);
            }
        }

        new Phaser.Game(config);
    </script>
</body>
</html>
