<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; background: #010a14; overflow: hidden; font-family: 'Arial', sans-serif; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: { preload: preload, create: create, update: update }
        };

        let player, food, enemies, score, levelText, cursors;

        function preload() {}

        function create() {
            score = parseInt(localStorage.getItem('playerScore')) || 1;

            // 1. DEEP SEA BACKGROUND
            this.add.grid(window.innerWidth/2, window.innerHeight/2, window.innerWidth*4, window.innerHeight*4, 100, 100, 0x000000, 0, 0x004466, 0.2);

            // 2. TEXTURES
            const pG = this.make.graphics().fillStyle(0xffffff).fillCircle(20, 20, 20);
            pG.generateTexture('cell', 40, 40);
            const fG = this.make.graphics().fillStyle(0x00ffaa).fillCircle(5, 5, 5);
            fG.generateTexture('plankton', 10, 10);

            // 3. PLAYER SETUP
            player = this.physics.add.sprite(window.innerWidth/2, window.innerHeight/2, 'cell');
            player.setCollideWorldBounds(true).setDamping(true).setDrag(0.1);

            // 4. GROUPS
            food = this.physics.add.group();
            enemies = this.physics.add.group();

            for(let i = 0; i < 40; i++) { spawnFood(); }
            for(let i = 0; i < 5; i++) { spawnEnemy(this); }

            // 5. UI
            levelText = this.add.text(30, 30, '', { fontSize: '26px', fontStyle: 'bold', fill: '#00f2ff' });
            updateEvolution();

            // 6. OVERLAPS (PREDATION)
            this.physics.add.overlap(player, food, (p, f) => {
                f.destroy();
                score += 1;
                spawnFood();
                updateEvolution();
            });

            this.physics.add.overlap(player, enemies, (p, e) => {
                // PREDATION LOGIC: If you are bigger, you eat them. If not, they "bite" you.
                if (score > e.getData('lvl')) {
                    score += 10;
                    e.destroy();
                    spawnEnemy(this);
                    this.cameras.main.shake(100, 0.01);
                    updateEvolution();
                } else {
                    score = Math.max(1, score - 5);
                    p.x -= 50; // Knockback
                    updateEvolution();
                }
            });

            cursors = this.input.keyboard.createCursorKeys();
        }

        function spawnFood() {
            food.create(Phaser.Math.Between(50, window.innerWidth-50), Phaser.Math.Between(50, window.innerHeight-50), 'plankton');
        }

        function spawnEnemy(scene) {
            let x = Phaser.Math.Between(0, window.innerWidth);
            let y = Phaser.Math.Between(0, window.innerHeight);
            let enemy = enemies.create(x, y, 'cell');
            let eLvl = Phaser.Math.Between(score - 10, score + 20);
            enemy.setData('lvl', eLvl);
            enemy.setScale(1 + (eLvl * 0.03));
            enemy.setTint(0xff3333); // Red for predators
            enemy.setVelocity(Phaser.Math.Between(-100, 100), Phaser.Math.Between(-100, 100));
            enemy.setBounce(1).setCollideWorldBounds(true);
        }

        function updateEvolution() {
            localStorage.setItem('playerScore', score);
            player.setScale(1 + (score * 0.03));
            
            let name = "Microbe";
            let color = 0x00ff88;

            if(score > 20) { name = "Complex Cell"; color = 0x00d9ff; }
            if(score > 50) { name = "Small Crustacean"; color = 0xaa00ff; }
            if(score > 150) { name = "Hunter Fish"; color = 0xffa500; }
            if(score > 300) { name = "Apex Leviathan"; color = 0xff0000; }

            levelText.setText(`EVOLUTION: ${name}\nGENETIC MASS: ${score}`);
            player.setTint(color);
        }

        function update() {
            const speed = 800;
            if (cursors.left.isDown) player.setAccelerationX(-speed);
            else if (cursors.right.isDown) player.setAccelerationX(speed);
            else player.setAccelerationX(0);

            if (cursors.up.isDown) player.setAccelerationY(-speed);
            else if (cursors.down.isDown) player.setAccelerationY(speed);
            else player.setAccelerationY(0);

            // Rotate smoothly toward movement
            if (player.body.velocity.x !== 0) {
                player.rotation = Phaser.Math.Angle.Between(0, 0, player.body.velocity.x, player.body.velocity.y);
            }
        }

        new Phaser.Game(config);
    </script>
</body>
</html>
