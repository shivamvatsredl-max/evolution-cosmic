<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>body { margin: 0; background: #222; overflow: hidden; }</style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade' },
            scene: { create: create, update: update }
        };

        let player;
        let food;
        let score = 1;
        let levelText;
        let cursors;

        function create() {
            // Create Graphics for the Player (Green Circle)
            const pGraphics = this.make.graphics().fillStyle(0x00ff00).fillCircle(20, 20, 20);
            pGraphics.generateTexture('player', 40, 40);

            // Create Graphics for Food (Red Square)
            const fGraphics = this.make.graphics().fillStyle(0xff0000).fillRect(0, 0, 15, 15);
            fGraphics.generateTexture('food', 15, 15);

            player = this.physics.add.sprite(window.innerWidth/2, window.innerHeight/2, 'player');
            player.setCollideWorldBounds(true);

            food = this.physics.add.group();
            for(let i = 0; i < 20; i++) {
                spawnFood(food);
            }

            levelText = this.add.text(20, 20, 'Level: 1 (Bacteria)', { fontSize: '24px', fill: '#fff' });
            
            this.physics.add.overlap(player, food, (p, f) => {
                f.destroy();
                score++;
                spawnFood(food);
                player.setScale(1 + (score * 0.05));
                
                let species = "Bacteria";
                if(score > 10) species = "Multi-Cellular";
                if(score > 50) species = "Small Fish";
                
                levelText.setText(`Level: ${score} (${species})`);
            }, null, this);

            cursors = this.input.keyboard.createCursorKeys();
        }

        function spawnFood(group) {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            group.create(x, y, 'food');
        }

        function update() {
            player.setVelocity(0);
            if (cursors.left.isDown) player.setVelocityX(-300);
            else if (cursors.right.isDown) player.setVelocityX(300);
            if (cursors.up.isDown) player.setVelocityY(-300);
            else if (cursors.down.isDown) player.setVelocityY(300);
        }

        new Phaser.Game(config);
    </script>
</body>
</html>
